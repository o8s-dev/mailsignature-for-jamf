<!doctype html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ _("Login") }} – Sig Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f5f6fa; }
    .lang-switch a { color:#64748b; text-decoration:none; font-size:.8rem; padding:0 4px; }
    .lang-switch a.active { color:#1a1f36; font-weight:600; }
  </style>
</head>
<body>
<div class="min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-sm" style="width:100%; max-width:400px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-envelope-at fs-1 text-primary"></i>
        <h4 class="fw-bold mt-2 mb-0">Sig Manager</h4>
        {% if first_time %}
          <p class="text-muted small mt-1">{{ _("Ersten Administrator-Account erstellen") }}</p>
        {% else %}
          <p class="text-muted small mt-1">{{ _("Bitte anmelden") }}</p>
        {% endif %}
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">{{ _("Benutzername") }}</label>
          <input type="text" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">{{ _("Passwort") }}</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          {% if first_time %}
            <i class="bi bi-person-plus me-1"></i>{{ _("Account erstellen & anmelden") }}
          {% else %}
            <i class="bi bi-box-arrow-in-right me-1"></i>{{ _("Anmelden") }}
          {% endif %}
        </button>
      </form>

      <div class="lang-switch text-center mt-3">
        <i class="bi bi-translate text-muted me-1"></i>
        <a href="{{ url_for('set_language', lang='de') }}" class="{% if current_lang=='de' %}active{% endif %}">DE</a>
        <span class="text-muted">|</span>
        <a href="{{ url_for('set_language', lang='en') }}" class="{% if current_lang=='en' %}active{% endif %}">EN</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
